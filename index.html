<!-- ===== Bản đồ làng nghề (đặt NGOÀI #__next để React không ghi đè) ===== -->

<div id="mapPanel">
  <div id="mapTools">
    <button id="mapZoomIn"  type="button" title="Phóng to">＋</button>
    <button id="mapZoomOut" type="button" title="Thu nhỏ">－</button>
    <button id="mapHide"    type="button" title="Ẩn bản đồ">✕</button>
  </div>
  <iframe src="ban-do-te-lo.html" title="Bản đồ làng nghề"></iframe>
</div>

<button id="mapToggle" type="button">🗺 Bản đồ</button>

<script>
(function () {
  var panel = document.getElementById("mapPanel");
  var toggle = document.getElementById("mapToggle");
  var zin = document.getElementById("mapZoomIn");
  var zout = document.getElementById("mapZoomOut");

  function setBig(big) {
    panel.classList.toggle("big", big);
    zin.disabled = big;      // đang to thì khóa nút phóng to
    zout.disabled = !big;    // đang nhỏ thì khóa nút thu nhỏ
  }
  setBig(false);

  zin.addEventListener("click", function () { setBig(true); });
  zout.addEventListener("click", function () { setBig(false); });
  document.getElementById("mapHide").addEventListener("click", function () {
    panel.classList.add("hide");   // bấm "🗺 Bản đồ" để mở lại
  });

  toggle.addEventListener("click", function () {
    panel.classList.toggle("hide");
  });

  // Lấy các thumbnail scene ở thanh dưới, xếp từ trái sang phải
  function getThumbs() {
    return [].slice.call(document.querySelectorAll("#__next img"))
      .filter(function (img) {
        if (img.closest("#mapPanel")) return false;
        var r = img.getBoundingClientRect();
        return r.width > 100 && r.height > 50 && r.top > window.innerHeight * 0.6;
      })
      .sort(function (a, b) {
        return a.getBoundingClientRect().left - b.getBoundingClientRect().left;
      });
  }
  window.getThumbs = getThumbs; // để gọi thử trong Console

  function toast(msg) {
    var t = document.createElement("div");
    t.textContent = msg;
    t.style.cssText = "position:fixed;left:50%;top:16px;transform:translateX(-50%);" +
      "background:#16324a;color:#fff;padding:8px 14px;border-radius:8px;" +
      "z-index:2147483002;font:14px sans-serif";
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2000);
  }

  // Danh sách phần tử scene theo đúng thứ tự thumbnail: marker số n <-> phần tử thứ n.
  // clickScene (Bản đồ -> VR360) và getCurrentScene (VR360 -> Bản đồ) cùng dùng danh sách này nên không thể lệch nhau.
  function sceneEls() {
    var els = getThumbs().map(function (img) { return img.closest(".itemScene") || img; });
    return els.length ? els : [].slice.call(document.querySelectorAll("#__next .itemScene"));
  }

  window.clickScene = function (n) {
     var el = sceneEls()[n - 1];
     if (!el) return false;
     var r = el.getBoundingClientRect();
     var base = {
     bubbles: true, cancelable: true, composed: true, view: window,
     clientX: r.left + r.width / 2, clientY: r.top + r.height / 2,
     button: 0, pointerId: 1, pointerType: "mouse", isPrimary: true
     };
     ["pointerdown", "mousedown", "pointerup", "mouseup", "click"].forEach(function (type) {
     var Ev = type.indexOf("pointer") === 0 ? PointerEvent : MouseEvent;
     el.dispatchEvent(new Ev(type, Object.assign({ buttons: type.slice(-4) === "down" ? 1 : 0 }, base)));
     });
     return true;
  };

  // ===== VR360 -> Bản đồ: báo cho bản đồ biết không gian panorama đang mở =====
  // Nguồn: thumbnail đang có class "active" (Panoee gán theo scene đang mở, không phụ thuộc hướng xoay camera).
  var mapFrame = panel.querySelector("iframe");
  var lastCur = 0;   // số thứ tự scene (1..n) đã báo gần nhất; 0 = chưa xác định

  function getCurrentScene() {
    var els = sceneEls();
    for (var i = 0; i < els.length; i++) {
      if (els[i].classList.contains("active")) return i + 1;
    }
    return 0;
  }
  window.getCurrentScene = getCurrentScene; // để gọi thử trong Console

  function syncMap(force) {
    var n = getCurrentScene() || (force ? lastCur : 0);
    if (!n || (!force && n === lastCur)) return;   // không đổi thì không gửi -> không có vòng lặp/lặp thừa
    lastCur = n;
    try { mapFrame.contentWindow.postMessage({ type: "current-scene", scene: n }, "*"); } catch (err) {}
  }

  var syncTimer = null;
  function scheduleSync() {
    if (syncTimer) return;
    syncTimer = setTimeout(function () { syncTimer = null; syncMap(false); }, 60);
  }
  var host = document.getElementById("__next");
  if (host) {
    new MutationObserver(scheduleSync).observe(host, {
      subtree: true, childList: true, attributes: true, attributeFilter: ["class"]
    });
  }
  setInterval(function () { syncMap(false); }, 1000);          // lưới an toàn, chỉ gửi khi cảnh thật sự đổi
  mapFrame.addEventListener("load", function () { syncMap(true); });

  window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "map-ready") { syncMap(true); return; }
  if (!e.data || e.data.type !== "goto-scene") return;
  console.log("Chuyển đến scene", e.data.scene, e.data.name);
  setBig(false);   // tự thu nhỏ bản đồ để thấy cảnh mới
  if (getCurrentScene() === +e.data.scene) { syncMap(true); return; }   // đã ở đúng cảnh này rồi
  if (!clickScene(e.data.scene)) { toast("Không tìm thấy cảnh " + e.data.scene + " trong tour"); syncMap(true); }
  // Thành công: Panoee đổi thumbnail active -> MutationObserver ở trên tự báo bản đồ.
  });

})();
</script>

<!-- ===== Đổi icon 2 hotspot sang icon âm thanh (dùng lại class icon âm thanh đã vá ở phần CSS phía trên) ===== -->
<script>
(function () {
  // Tên hai hotspot cần đổi icon. So khớp theo "có chứa", không phân biệt hoa/thường, bỏ khoảng trắng thừa
  // (vd. "Dòng chảy kinh tế" khớp với tiêu đề "Tề Lỗ và dòng chảy kinh tế")
  var NAMES = ["Âm thanh Tề Lỗ", "Dòng chảy kinh tế"];
  // Class icon âm thanh: dùng đúng .MusicNote01Icon đã có trong CSS "Vá icon Panoee".
  // Nếu các hotspot âm thanh khác của bạn dùng icon khác (vd. "AiSpeechIcon"), chỉ cần đổi dòng này.
  var SOUND_ICON = "MusicNote01Icon";
  // Hotspot kiểu mặc định của Panoee (không dùng icon tùy chọn) hiển thị âm thanh bằng class này
  var SOUND_ICON_DEFAULT = "fas fa-waveform";

  function norm(t) {
    return (t || "").replace(/\s+/g, " ").trim().toLowerCase();
  }
  var wanted = NAMES.map(norm);

  function findIcon(titleEl) {
    var node = titleEl.parentElement;
    for (var d = 0; node && d < 4; d++, node = node.parentElement) {
      var i = node.querySelector(".content i");
      if (i) return i;
    }
    return null;
  }

  function apply() {
    var titles = document.querySelectorAll(".--title em");
    for (var k = 0; k < titles.length; k++) {
      var t = norm(titles[k].textContent);
      var hit = false;
      for (var w = 0; w < wanted.length; w++) { if (t.indexOf(wanted[w]) !== -1) { hit = true; break; } }
      if (!hit) continue;
      var icon = findIcon(titles[k]);
      if (!icon) continue;
      var target = /(^|\s)fa-/.test(icon.className) ? SOUND_ICON_DEFAULT : SOUND_ICON;
      if (icon.className !== target) icon.className = target;
    }
  }

  var timer = null;
  function schedule() {
    if (timer) return;
    timer = setTimeout(function () { timer = null; apply(); }, 120);
  }
  apply();
  new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
})();
</script>
